name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        env:
          PAT_1: ${{ secrets.STATS_TOKEN }}
          USER: ${{ github.repository_owner }}
        run: |
          mkdir -p profile
          git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git /tmp/grs
          cd /tmp/grs
          npm install --no-audit --no-fund
          cat > gen.mjs <<'EOF'
          import fs from "fs";
          import stats from "./api/index.js";
          import langs from "./api/top-langs.js";

          const run = async (handler, query, out) => {
            let body = "";
            const res = {
              setHeader() {},
              send(b) { body = b; },
            };
            await handler({ query }, res);
            fs.writeFileSync(out, body);
          };

          const user = process.env.USER;
          const dir = process.env.GITHUB_WORKSPACE + "/profile/";

          await run(stats, { username: user, show_icons: "true", theme: "tokyonight", hide_border: "true" }, dir + "stats.svg");
          await run(langs, { username: user, layout: "compact", theme: "tokyonight", hide_border: "true" }, dir + "top-langs.svg");
          EOF
          node gen.mjs
          
      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub profile stats" || exit 0
          git push
