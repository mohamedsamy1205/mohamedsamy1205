name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        env:
          PAT_1: ${{ secrets.STATS_TOKEN }}
          USER: ${{ github.repository_owner }}
        run: |
          mkdir -p profile
          git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git /tmp/grs
          cd /tmp/grs
          npm install --no-audit --no-fund
          cat > gen.js <<'EOF'
          const fs = require("fs");
          const stats = require("./api/index.js");
          const langs = require("./api/top-langs.js");
          const run = async (handler, query, out) => {
            let body = "";
            const res = {
              setHeader() {},
              send(b) { body = b; },
            };
            await handler({ query }, res);
            fs.writeFileSync(out, body);
          };
          (async () => {
            const user = process.env.USER;
            await run(stats, { username: user, show_icons: "true", theme: "tokyonight", hide_border: "true" }, process.env.GITHUB_WORKSPACE + "/profile/stats.svg");
            await run(langs, { username: user, layout: "compact", theme: "tokyonight", hide_border: "true" }, process.env.GITHUB_WORKSPACE + "/profile/top-langs.svg");
          })();
          EOF
          node gen.js

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub profile stats" || exit 0
          git push
